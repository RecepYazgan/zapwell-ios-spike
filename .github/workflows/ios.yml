name: iOS spike

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash # -eo pipefail, so "| tail" does not hide a failed build

jobs:
  # Kotlin/Native for the Mac job: GitHub's release downloads answered 504 to the macOS runners every time.
  konan:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fL --retry 8 --retry-all-errors --retry-delay 15 -o kn.tar.gz             https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-native-prebuilt-2.3.21-macos-aarch64.tar.gz
          ls -la kn.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: konan
          path: kn.tar.gz
          retention-days: 1
          compression-level: 0

  build:
    needs: konan
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - uses: actions/download-artifact@v4
        with:
          name: konan
          path: kn

      - name: Kotlin framework
        # The runner's (or Homebrew's) Gradle: services.gradle.org answered 504 to the wrapper download from GitHub's Macs.
        run: |
          command -v gradle || brew install gradle
          gradle --version | head -3
          mkdir -p ~/.konan && tar -xzf kn/kn.tar.gz -C ~/.konan
          KN=$(ls ~/.konan | grep kotlin-native-prebuilt | head -1); echo "konan: $KN"
          for i in 1 2 3; do gradle --no-daemon -Pkotlin.native.home=$HOME/.konan/$KN :shared:assembleSharedReleaseXCFramework && exit 0; sleep 60; done; exit 1

      - name: Tools
        run: brew install xcodegen ffmpeg

      - name: Xcode project
        run: |
          xcodegen generate
          pod install

      - name: Build for the simulator
        run: |
          xcodebuild -workspace ZapSpike.xcworkspace -scheme ZapSpike -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath dd-sim ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Run on an iPad simulator
        run: bash ci/simulator-test.sh dd-sim/Build/Products/Release-iphonesimulator/ZapSpike.app out

      - name: Build for the device (unsigned ipa)
        run: |
          xcodebuild -workspace ZapSpike.xcworkspace -scheme ZapSpike -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd-dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          mkdir -p ipa/Payload
          cp -R dd-dev/Build/Products/Release-iphoneos/ZapSpike.app ipa/Payload/
          (cd ipa && zip -qry ../out/ZapSpike-unsigned.ipa Payload)
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zapspike
          path: out
          retention-days: 7
